<style>
/* Layout: an atlas of language tiles (one colour per language), then a three-step path per language: discover, listen, quiz. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --fg:#131830; --muted:#586079; --line:#D3D9E6;
  --accent:#3347FF; --accent-fg:#FFFFFF; --good:#12805C; --bad:#C23B22; --good-bg:#DDF3EA; --bad-bg:#FBE4DE;
  --t-bg-s:70%; --t-bg-l:90%; --t-fg-s:60%; --t-fg-l:30%;
  --f-display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1120; --surface:#171B30; --fg:#EEF0FA; --muted:#98A0BC; --line:#2A3050;
    --accent:#8191FF; --accent-fg:#0E1120; --good:#4CD4A0; --bad:#FF8A72; --good-bg:#12372C; --bad-bg:#46211A;
    --t-bg-s:32%; --t-bg-l:19%; --t-fg-s:80%; --t-fg-l:78%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B30; --fg:#EEF0FA; --muted:#98A0BC; --line:#2A3050;
  --accent:#8191FF; --accent-fg:#0E1120; --good:#4CD4A0; --bad:#FF8A72; --good-bg:#12372C; --bad-bg:#46211A;
  --t-bg-s:32%; --t-bg-l:19%; --t-fg-s:80%; --t-fg-l:78%; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
.col{display:flex;flex-direction:column;gap:18px}
.topr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem}
.aud{font-size:.8rem;color:var(--muted);min-height:1.2em;overflow-wrap:anywhere}
.hero .aud{color:var(--fg);opacity:.8}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.total{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:800;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{--tbg:hsl(var(--h) var(--t-bg-s) var(--t-bg-l));--tfg:hsl(var(--h) var(--t-fg-s) var(--t-fg-l));
  background:var(--tbg);color:var(--tfg);border:0;border-radius:14px;padding:12px 14px 12px;text-align:left;
  display:flex;flex-direction:column;gap:2px;min-height:112px;min-width:0;position:relative}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile:disabled{opacity:.6;cursor:default}
.tile .rank{font-size:.72rem;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums;opacity:.8}
.tile .nat{font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.tile .nm{font-size:.82rem;color:var(--fg);opacity:.85}
.tile .dots{display:flex;gap:4px;margin-top:auto;padding-top:8px}
.dot{width:16px;height:5px;border-radius:3px;background:var(--tfg);opacity:.25}
.dot.on{opacity:1}
.soon{font-size:.72rem;font-weight:700;margin-top:auto;padding-top:8px}
.back{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.hero{--tbg:hsl(var(--h) var(--t-bg-s) var(--t-bg-l));--tfg:hsl(var(--h) var(--t-fg-s) var(--t-fg-l));
  background:var(--tbg);color:var(--tfg);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:6px}
.hero .nat{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,11vw,4rem);line-height:1.1;overflow-wrap:anywhere}
.hero .meta{color:var(--fg);font-size:.95rem}
.note{font-size:.85rem;color:var(--fg);opacity:.8;margin-top:4px}
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;width:100%}
.lesson:disabled{opacity:.55;cursor:default}
.lesson .n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;border:2px solid var(--accent);color:var(--accent)}
.lesson.done .n{background:var(--good);border-color:var(--good);color:var(--surface)}
.lesson .tx{min-width:0;flex:1}
.lesson .tx b{display:block;font-family:var(--f-display);font-size:1.1rem}
.lesson .tx span{font-size:.88rem;color:var(--muted)}
.lesson .st{font-size:.82rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.lhead{display:flex;flex-direction:column;gap:10px}
.lhead .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lhead .ttl{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fr{font-size:1.05rem;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,3rem);line-height:1.15;overflow-wrap:anywhere}
.roman{font-size:1.15rem;color:var(--accent);font-weight:500;overflow-wrap:anywhere}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 18px;font-weight:700}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;width:100%}
.opt .o1{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.opt .o2{font-size:.85rem;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.ko{background:var(--bad-bg);border-color:var(--bad)}
.fb{font-weight:700}
.fb.ok{color:var(--good)} .fb.ko{color:var(--bad)}
.score{font-family:var(--f-display);font-weight:800;font-size:3.2rem;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:calc(100% - 32px);z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.tile:hover{transform:none}}
</style>

    let vs=[];try{vs=speechSynthesis.getVoices()}catch(e){}
    if(vs.length)return res(vs);
    let fin=false;const done=()=>{if(fin)return;fin=true;let v=[];try{v=speechSynthesis.getVoices()}catch(e){}res(v)};
    try{speechSynthesis.addEventListener("voiceschanged",done,{once:true})}catch(e){}
    setTimeout(done,1200);
  });
}
function pickVoice(vs,cands){
  for(const c of cands){
    const b=c.toLowerCase();
    const m=vs.filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(b));
    if(m.length)return m.find(v=>/google|enhanced|premium|natural|neural/i.test(v.name))||m[0];
  }
  return null;
}
function deviceSpeak(text,v,lang,rate){
  return new Promise((res,rej)=>{
    const u=new SpeechSynthesisUtterance(text);
    if(v){u.voice=v;u.lang=v.lang}else{u.lang=lang}
    u.rate=rate;
    let started=false;
    const to=setTimeout(()=>{if(!started){try{speechSynthesis.cancel()}catch(e){}rej(new Error("timeout"))}},3000);
    u.onstart=()=>{started=true;clearTimeout(to);res()};
    u.onerror=e=>{clearTimeout(to);if(!started)rej(new Error((e&&e.error)||"error"))};
    speechSynthesis.speak(u);
  });
}
function playOnline(text,gt,rate){
  return new Promise((res,rej)=>{
    const a=new Audio();
    a.preload="auto";
    a.src="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+encodeURIComponent(gt)+"&q="+encodeURIComponent(text);
    a.playbackRate=rate;
    try{a.preservesPitch=true}catch(e){}
    curAudio=a;
    const to=setTimeout(()=>rej(new Error("timeout")),6000);
    a.onerror=()=>{clearTimeout(to);rej(new Error("error"))};
    const p=a.play();
    if(p&&p.then)p.then(()=>{clearTimeout(to);res()}).catch(err=>{clearTimeout(to);rej(err)});
  });
}
async function speak(text,lg,slow){
  stopAll();const tok=speakToken;
  const clean=text.replace(/…/g,"").replace(/\s+/g," ").trim();
  setAud("…");
  const vs=await voicesReady();
  if(tok!==speakToken)return;
  const v=pickVoice(vs,lg.tts);
  const canDevice=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance)&&(v||vs.length===0);
  if(canDevice){
    try{await deviceSpeak(clean,v,lg.tts[0],slow?0.6:0.9);setAud(v?t("viaDev",{v:v.name}):t("viaDev0"));return}
    catch(e){if(tok!==speakToken)return}
  }
  if(lg.gt){
    try{await playOnline(clean,lg.gt,slow?0.7:1);if(tok!==speakToken)return;setAud(t("viaNet"));return}
    catch(e){if(tok!==speakToken)return}
  }
  const msg=t("noV",{l:nm(lg)});
  setAud(msg);toast(msg);
}

function lessonItems(lg,li){
  const b=baseL();
  return lg.items.slice(li*6,li*6+6).map((it,k)=>{const i=li*6+k;return{...it,b:b.items[i].t,br:b.items[i].r,i}});
}

function renderTop(){
  let done=0;const tg=targets();
  if(S.base)tg.forEach(l=>{for(let i=0;i<3;i++)if(passed(l.id,i))done++});
  $("#top").innerHTML='<div class="brand">'+esc(t("app"))+'</div><div class="topr">'
    +(S.base?'<button class="chip" data-act="chbase">'+esc(t("speak"))+' : <b dir="auto">'+esc(baseL().nat)+'</b> · '+esc(t("change"))+'</button>'
      +'<span class="total">'+esc(t("done",{n:done,m:tg.length*3}))+'</span>':'')+'</div>';
}
function dots(id){return [0,1,2].map(i=>'<i class="dot'+(passed(id,i)?' on':'')+'"></i>').join("")}

function renderBase(){
  const tiles=PLAYABLE.map(l=>
    '<button class="tile" style="--h:'+l.h+'" data-act="setbase" data-id="'+l.id+'">'
    +'<span class="rank">'+(l.id===navLang?esc(t("sugg")).toUpperCase():esc(t("rank",{n:l.rank})))+'</span>'
    +'<span class="nat" dir="auto">'+esc(l.nat)+'</span>'
    +'<span class="nm">'+esc(nm(l))+'</span></button>').join("");
  app.innerHTML='<div class="col"><div><h1>'+esc(t("baseH"))+'</h1><p class="sub">'+esc(t("baseP"))+'</p></div><div class="grid">'+tiles+'</div></div>';
  window.scrollTo(0,0);
}

function renderHome(){
  const tiles=LANGS.filter(l=>l.id!==S.base).map(l=>
    '<button class="tile" style="--h:'+l.h+'" data-act="open" data-id="'+l.id+'"'+(l.locked?' disabled':'')+'>'
    +'<span class="rank">'+esc(t("rank",{n:l.rank}))+'</span>'
    +'<span class="nat" dir="auto">'+esc(l.nat)+'</span>'
    +'<span class="nm">'+esc(nm(l))+' · '+fmtSp(l.sp)+'</span>'
    +(l.locked?'<span class="soon">'+esc(t("soon"))+'</span>':'<span class="dots">'+dots(l.id)+'</span>')+'</button>').join("");
  app.innerHTML='<div class="col"><div><h1>'+esc(t("tgtH"))+'</h1><p class="sub">'+esc(t("tgtP",{b:nm(baseL())}))+'</p></div><div class="grid">'+tiles+'</div></div>';
  window.scrollTo(0,0);
}

function renderLang(){
  const lg=cur();
  const ls=[0,1,2].map(i=>{
    const ok=unlocked(lg.id,i),sc=scores(lg.id)[i],done=passed(lg.id,i);
    const st=!ok?t("locked"):(sc===null?t("todo"):t(done?"ok":"retry",{s:sc,n:QN}));
    return '<button class="lesson'+(done?' done':'')+'" data-act="lesson" data-i="'+i+'"'+(ok?'':' disabled')+'>'
      +'<span class="n">'+(done?'✓':(i+1))+'</span>'
      +'<span class="tx"><b>'+esc(t("l"+(i+1)))+'</b><span>'+esc(t("l"+(i+1)+"s"))+'</span></span>'
      +'<span class="st">'+esc(st)+'</span></button>';
  }).join("");
  const note=NOTES[lg.id]?NOTES[lg.id][uiCode()==="fr"?0:1]:"";
  app.innerHTML='<div class="col">'
    +'<button class="back" data-act="home">'+esc(t("all"))+'</button>'
    +'<div class="hero" style="--h:'+lg.h+'"><span class="eyebrow" style="color:inherit;opacity:.8">'+esc(t("rankW",{n:lg.rank}))+'</span>'
    +'<div class="nat" dir="auto">'+esc(lg.nat)+'</div>'
    +'<div class="meta">'+esc(nm(lg))+' · '+esc(t("spk",{m:lg.sp}))+'</div>'
    +(note?'<div class="note">'+esc(note)+'</div>':'')
    +'<div class="btns" style="margin-top:10px"><button class="btn" data-act="say" data-t="'+esc(lg.items[0].t)+'">▶ '+esc(t("test"))+'</button></div>'
    +'<div class="aud" id="aud"></div></div>'
    +'<div class="lessons">'+ls+'</div></div>';
  window.scrollTo(0,0);
}

function head(pct,label){
  return '<div class="lhead"><div class="row"><button class="back" data-act="lang">'+esc(t("lessonsBack"))+'</button><span class="ttl">'+esc(label)+'</span></div>'
    +'<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
}
function bText(o,k){return esc(o[k])}

function renderLearn(){
  const lg=cur(),its=lessonItems(lg,S.lesson),it=its[S.idx],last=S.idx===its.length-1;
  app.innerHTML='<div class="col">'
    +head((S.idx+1)/its.length*100,nm(lg)+" · "+t("l"+(S.lesson+1)))
    +'<div class="card"><span class="eyebrow">'+esc(t("phrase",{i:S.idx+1,n:its.length}))+'</span>'
    +'<div class="fr" dir="auto">'+esc(it.b)+(it.br?' <span style="opacity:.75">('+esc(it.br)+')</span>':'')+'</div>'
    +'<div class="big" lang="'+lg.tts[0]+'" dir="auto">'+esc(it.t)+'</div>'
    +(it.r?'<div class="roman" dir="auto">'+esc(it.r)+'</div>':'')
    +'<div class="btns"><button class="btn pri" data-act="say" data-t="'+esc(it.t)+'">▶ '+esc(t("listen"))+'</button>'
    +'<button class="btn" data-act="say" data-slow="1" data-t="'+esc(it.t)+'">▶ '+esc(t("slow"))+'</button></div>'
    +'<div class="aud" id="aud"></div></div>'
    +'<div class="btns"><button class="btn" data-act="prev"'+(S.idx===0?' disabled':'')+'>'+esc(t("prev"))+'</button>'
    +'<button class="btn pri" data-act="next">'+esc(last?t("toQuiz"):t("next"))+'</button></div></div>';
  window.scrollTo(0,0);
}

function buildQuiz(){
  const lg=cur(),b=baseL(),its=lessonItems(lg,S.lesson);
  const all=lg.items.map((x,i)=>({t:x.t,r:x.r,b:b.items[i].t,br:b.items[i].r,i}));
  const qs=[];
  its.forEach(it=>{
    const others=all.filter(a=>a.i!==it.i);
    qs.push({k:"tf",it,opts:shuffle([it,...shuffle(others).slice(0,3)])});
    qs.push({k:"ft",it,opts:shuffle([it,...shuffle(others).slice(0,3)])});
  });
  return shuffle(qs);
}

function renderQuiz(){
  const lg=cur(),q=S.qs[S.qi],a=S.answered;
  const prompt=q.k==="tf"
    ?'<span class="eyebrow">'+esc(t("q1"))+'</span><div class="big" lang="'+lg.tts[0]+'" dir="auto">'+esc(q.it.t)+'</div>'+(q.it.r?'<div class="roman" dir="auto">'+esc(q.it.r)+'</div>':'')
      +'<div class="btns"><button class="btn" data-act="say" data-t="'+esc(q.it.t)+'">▶ '+esc(t("listen"))+'</button></div>'
    :'<span class="eyebrow">'+esc(t("q2"))+'</span><div class="big" dir="auto">'+esc(q.it.b)+'</div>'+(q.it.br?'<div class="roman" dir="auto">'+esc(q.it.br)+'</div>':'');
  const opts=q.opts.map((o,k)=>{
    let cls="opt";
    if(a!==null){if(o.i===q.it.i)cls+=" ok";else if(k===a)cls+=" ko"}
    const body=q.k==="tf"
      ?'<span class="o1" dir="auto">'+esc(o.b)+'</span>'+(o.br?'<span class="o2" dir="auto">'+esc(o.br)+'</span>':'')
      :'<span class="o1" dir="auto" lang="'+lg.tts[0]+'">'+esc(o.t)+'</span>'+(o.r?'<span class="o2" dir="auto">'+esc(o.r)+'</span>':'');
    return '<button class="'+cls+'" data-act="ans" data-k="'+k+'"'+(a!==null?' disabled':'')+'>'+body+'</button>';
  }).join("");
  let fb="";
  if(a!==null){
    const good=q.opts[a].i===q.it.i;
    fb='<div class="fb '+(good?'ok':'ko')+'">'+esc(good?t("right"):t("wrong"))+'</div>'
      +'<div class="btns"><button class="btn pri" data-act="cont">'+esc(S.qi===S.qs.length-1?t("seeScore"):t("cont"))+'</button>'
      +'<button class="btn" data-act="say" data-t="'+esc(q.it.t)+'">▶ '+esc(t("listen"))+'</button></div>';
  }
  app.innerHTML='<div class="col">'
    +head((S.qi+(a!==null?1:0))/S.qs.length*100,t("qprog",{i:S.qi+1,n:S.qs.length}))
    +'<div class="card">'+prompt+'<div class="aud" id="aud"></div></div><div class="opts">'+opts+'</div>'+fb+'</div>';
  window.scrollTo(0,0);
}

function renderResult(){
  const lg=cur(),ok=S.score>=PASS,hasNext=S.lesson<2;
  app.innerHTML='<div class="col">'
    +head(100,nm(lg)+" · "+t("l"+(S.lesson+1)))
    +'<div class="card"><span class="eyebrow">'+esc(t("res"))+'</span><div class="score">'+S.score+' / '+QN+'</div>'
    +'<div class="fb '+(ok?'ok':'ko')+'">'+esc(ok?(hasNext?t("passNext"):t("passLast")):t("fail",{p:PASS}))+'</div>'
    +'<div class="btns">'
    +(ok&&hasNext?'<button class="btn pri" data-act="nextlesson">'+esc(t("nextL"))+'</button>':'')
    +'<button class="btn'+(ok&&hasNext?'':' pri')+'" data-act="redo">'+esc(ok?t("redo"):t("review"))+'</button>'
    +'<button class="btn" data-act="lang">'+esc(t("backL"))+'</button></div></div></div>';
  window.scrollTo(0,0);
}

function go(view){
  S.view=view;
  document.documentElement.lang=uiCode();
  renderTop();
  ({base:renderBase,home:renderHome,lang:renderLang,learn:renderLearn,quiz:renderQuiz,result:renderResult})[view]();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const act=b.dataset.act;
  if(act==="setbase"){S.base=b.dataset.id;mem._base=S.base;save();go("home")}
  else if(act==="chbase"){stopAll();go("base")}
  else if(act==="open"){S.lang=b.dataset.id;go("lang")}
  else if(act==="home"){stopAll();go("home")}
  else if(act==="lang"){stopAll();go("lang")}
  else if(act==="lesson"){S.lesson=+b.dataset.i;S.idx=0;go("learn")}
  else if(act==="say"){speak(b.dataset.t,cur(),!!b.dataset.slow)}
  else if(act==="prev"){S.idx=Math.max(0,S.idx-1);go("learn")}
  else if(act==="next"){
    if(S.idx<5){S.idx++;go("learn")}
    else{S.qs=buildQuiz();S.qi=0;S.score=0;S.answered=null;go("quiz")}
  }
  else if(act==="ans"){
    if(S.answered!==null)return;
    const k=+b.dataset.k,q=S.qs[S.qi];S.answered=k;
    if(q.opts[k].i===q.it.i)S.score++;
    renderQuiz();
    speak(q.it.t,cur(),false);
  }
  else if(act==="cont"){
    stopAll();
    if(S.qi<S.qs.length-1){S.qi++;S.answered=null;go("quiz")}
    else{
      const arr=scores(S.lang).slice();
      arr[S.lesson]=Math.max(arr[S.lesson]===null?0:arr[S.lesson],S.score);
      mem[S.lang]=arr;save();go("result");
    }
  }
  else if(act==="redo"){S.idx=0;go("learn")}
  else if(act==="nextlesson"){S.lesson++;S.idx=0;go("learn")}
});

if(mem._base&&PLAYABLE.some(l=>l.id===mem._base)){S.base=mem._base;go("home")}else go("base");

voicesReady();
</script>
